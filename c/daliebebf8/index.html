<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E1215"><meta name="description" content="Tu programa de entrenamiento."><meta property="og:title" content="Método Dalí"><meta property="og:description" content="Tu programa de entrenamiento."><meta property="og:image" content="https://dalifpibarra-png.github.io/modo/img/og.jpg"><link rel="manifest" href="../../manifest.webmanifest"><link rel="icon" href="../../icon-192.png"><link rel="apple-touch-icon" href="../../icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Método Dalí"><style>html{-webkit-text-size-adjust:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style></head><body><title>Método Dalí · Dalí</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
/* MODO · motor de panel de salud (v5 · 15 oct 2026)
   Layout: app de una columna pensada para el pulgar; cinco destinos abajo,
   cada uno con sus sub-vistas arriba. Tarjeta solo para lo que se toca.
   Color: los de las placas olímpicas. Cobalto (la de 20 kg) es el único
   acento; verde 10, amarillo 15 y rojo 25 son semánticos: bien, ojo, alto.
   Neutros: gis/magnesio en claro, piso de hule en oscuro.
   Tipo: Archivo (con eje de anchura) para cifras y títulos, Atkinson
   Hyperlegible para leer entre series, IBM Plex Mono para los datos. */
:root{
  color-scheme: light;
  --bg:#EFF2F1; --card:#FFFFFF; --sunk:#E4E9E8; --ink:#141B21; --ink2:#44515B; --ink3:#6F7C86; --line:#D3DADA;
  --acc:#1F4FD8; --acc-ink:#FFFFFF; --acc-w:#E2E9FB;
  --ok:#1C7343; --ok-w:#E1F1E7;
  --warn:#9A6410; --warn-w:#FBF0DA; --plate15:#E2B33C;
  --bad:#BE3128; --bad-w:#FBE6E3;
  --bar:#8A959E;
  --floor:#11171B; --floor2:#1B242B; --on-floor:#EAF0F2; --on-floor2:#A3B0B9; --gold:#B7861F; --gold-w:#FBF1D8;
  --display:"Archivo","Arial Narrow",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --data:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:16px; --r-s:10px;
  --shadow:0 1px 1px rgba(20,27,33,.04),0 8px 20px -14px rgba(20,27,33,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1215; --card:#161C21; --sunk:#1E252B; --ink:#E8EDEF; --ink2:#AAB6BE; --ink3:#7C8992; --line:#29323A;
    --acc:#7C9DF5; --acc-ink:#0E1215; --acc-w:#18233F;
    --ok:#6FCB94; --ok-w:#14281C;
    --warn:#E9B957; --warn-w:#2A2110; --plate15:#E9B957;
    --bad:#F08A7E; --bad-w:#2E1715;
    --bar:#5D6870;
    --floor:#0A0E11; --floor2:#151C22; --gold:#E9B957; --gold-w:#2A2110;
    --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 20px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1215; --card:#161C21; --sunk:#1E252B; --ink:#E8EDEF; --ink2:#AAB6BE; --ink3:#7C8992; --line:#29323A;
  --acc:#7C9DF5; --acc-ink:#0E1215; --acc-w:#18233F;
  --ok:#6FCB94; --ok-w:#14281C;
  --warn:#E9B957; --warn-w:#2A2110; --plate15:#E9B957;
  --bad:#F08A7E; --bad-w:#2E1715;
  --bar:#5D6870;
  --floor:#0A0E11; --floor2:#151C22; --gold:#E9B957; --gold-w:#2A2110;
  --shadow:0 1px 1px rgba(0,0,0,.3),0 8px 20px -14px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);overflow-x:clip}
h1,h2,h3,h4,p,ul,ol,dl{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
:where(button,input,select,textarea,summary,a):focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.num,.data{font-family:var(--data);font-variant-numeric:tabular-nums}
.wrap{max-width:48rem;margin:0 auto;padding-inline:16px;padding-block:0 calc(92px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;letter-spacing:-.01em}
.t-big{font:800 1.9rem/1.05 var(--display);font-stretch:112%;letter-spacing:-.02em}
.t-sec{font:750 1.2rem/1.2 var(--display)}
.lbl{font:700 .68rem/1.2 var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.tiny{font-size:.8rem;color:var(--ink3);line-height:1.4}
.sub{color:var(--ink2);font-size:.92rem}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* ── cabecera ── */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px}
.marca{font:900 1.05rem/1 var(--display);font-stretch:118%;letter-spacing:.04em}
.marca em{font-style:normal;color:var(--acc)}
.top .who{flex:1;min-width:0;font-size:.8rem;color:var(--ink2);line-height:1.25;text-align:right}
.icbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:44px;min-height:44px;display:grid;place-items:center;cursor:pointer;font-size:1.05rem}
#sync{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ink3);margin-left:6px;vertical-align:1px}
#sync[data-s="ok"]{background:var(--ok)} #sync[data-s="err"]{background:var(--bad)}
.demo-band{background:var(--warn-w);border:1px solid var(--warn);color:var(--ink);border-radius:var(--r-s);padding:8px 12px;font-size:.84rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.aviso{background:var(--warn-w);border:1px solid var(--warn);border-radius:var(--r-s);padding:10px 12px;font-size:.88rem;margin-bottom:10px}

/* ── sub-vistas (segmentado) ── */
.seg{display:flex;gap:4px;background:var(--sunk);border-radius:12px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;border-radius:9px;min-height:40px;padding:0 14px;font:700 .84rem/1 var(--display);color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

/* ── superficies ── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card>h2,.card>.hd{margin-bottom:10px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hd h2{font:750 1.05rem/1.2 var(--display)}
.flat{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:4px;font:700 .72rem/1 var(--display);letter-spacing:.03em;border-radius:999px;padding:5px 9px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.pill.ok{background:var(--ok-w);color:var(--ok)} .pill.warn{background:var(--warn-w);color:var(--warn)} .pill.bad{background:var(--bad-w);color:var(--bad)} .pill.acc{background:var(--acc-w);color:var(--acc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;min-height:46px;font:700 .92rem/1 var(--display);cursor:pointer;color:var(--ink);text-decoration:none;transition:transform .12s}
.btn:active,.chips button:active,.seg button:active,.nav button:active{transform:scale(.97)}
.btn.go{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.wide{width:100%;min-height:54px;font-size:1rem}
.btn.ghost{background:transparent}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .k{font:700 .66rem/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.kpi .v{font:800 1.45rem/1.15 var(--display);font-stretch:110%;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .v small{font:600 .62em var(--body);color:var(--ink3);margin-left:2px}
.kpi .d{font-size:.74rem;color:var(--ink3);margin-top:2px}
.kpi .d.up{color:var(--ok)} .kpi .d.dn{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;min-height:40px;font-size:.88rem;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details{border-top:1px solid var(--line)}
details>summary{cursor:pointer;list-style:none;min-height:46px;display:flex;align-items:center;gap:8px;font:700 .92rem/1.2 var(--display)}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";margin-left:auto;color:var(--ink3);font:400 1.3rem/1 var(--body)}
details[open]>summary::after{content:"–"}
details .body{padding-bottom:14px;color:var(--ink2);font-size:.92rem;display:grid;gap:8px}
input[type=number],input[type=text],input[type=date],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:var(--r-s);padding:10px;font-size:16px;min-height:46px}
textarea{min-height:96px;resize:vertical;line-height:1.45}
label.f{display:grid;gap:4px;min-width:0}
label.f>span{font:700 .72rem/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--ink3)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:700 .68rem/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--data);font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
svg text{font-family:var(--data)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--ink3);font-size:.9rem}

/* ── HOY: la barra cargada ── */
.hero-dia{display:grid;gap:6px}
.hero-dia .saludo{font:800 1.6rem/1.1 var(--display);font-stretch:112%}
.barra-wrap{position:relative;margin:4px -4px 0}
.barra-wrap svg{display:block;width:100%;height:auto}
.plate{transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.plate.off{opacity:.18}
.score{display:flex;align-items:baseline;gap:8px;justify-content:center;margin-top:-4px}
.score b{font:900 2.6rem/1 var(--display);font-stretch:116%;font-variant-numeric:tabular-nums}
.score span{color:var(--ink2);font-size:.9rem}
.pilares{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pilar{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 4px;text-align:center;cursor:pointer;min-height:68px;display:grid;gap:2px;align-content:center}
.pilar .i{font-size:1.15rem;line-height:1}
.pilar .n{font:700 .6rem/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pilar .v{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pilar .v{font:700 .82rem/1.1 var(--data)}
.pilar[data-s="full"]{border-color:var(--ok);background:var(--ok-w)}
.pilar[data-s="half"]{border-color:var(--warn)}
.semana{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.semana div{text-align:center;font-size:.7rem;color:var(--ink3);display:grid;gap:4px;justify-items:center}
.semana i{display:block;width:100%;max-width:38px;aspect-ratio:1;border-radius:10px;background:var(--sunk);position:relative}
.semana i b{position:absolute;inset:0;display:grid;place-items:center;font:700 .72rem var(--data);color:var(--ink2)}
.semana .hoy i{outline:2px solid var(--acc);outline-offset:1px}
.siguiente{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.siguiente .hora{font:800 1.1rem/1 var(--data);color:var(--acc)}
.coachbox{border-left:4px solid var(--acc);background:var(--acc-w);border-radius:0 12px 12px 0;padding:10px 12px;font-size:.92rem}
.coachbox .lbl{color:var(--acc);display:block;margin-bottom:2px}
.stepper{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;gap:6px;align-items:center}
.stepper button{min-height:46px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--card);font-size:1.2rem;cursor:pointer}
.stepper output{text-align:center;font:700 1.1rem var(--data)}
.vasos{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
.vasos i{width:14px;height:18px;border-radius:2px 2px 4px 4px;border:1.5px solid var(--acc);opacity:.35}
.vasos i.on{background:var(--acc);opacity:1}

/* ── ENTRENO ── */
.dias{display:grid;grid-template-columns:repeat(var(--nd,5),minmax(0,1fr));gap:6px;margin-bottom:12px}
.dias button{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:54px;padding:4px 2px;cursor:pointer;line-height:1.15}
.dias button b{display:block;font:750 .8rem/1.1 var(--display)}
.dias button span{font-size:.68rem;color:var(--ink3)}
.dias button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dias button[aria-pressed="true"] span{color:inherit;opacity:.75}
.dias button.hecho::after{content:"✓";display:block;font-size:.7rem;color:var(--ok)}
.dias button[aria-pressed="true"].hecho::after{color:inherit}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:2px 0 10px}
.dayhead h2{font:850 1.5rem/1.1 var(--display);font-stretch:110%}
#timer{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:20;display:none;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
#timer.on{display:flex}
#timer .t{font:700 1.6rem/1 var(--data);min-width:4.4ch}
#timer .l{font-size:.78rem;opacity:.8;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#timer button{background:transparent;border:1px solid currentColor;border-radius:9px;padding:4px 12px;min-height:38px;cursor:pointer}
#timer.ring{background:var(--ok);color:var(--card)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.ex.listo{border-color:var(--ok)}
.ex h3{font:750 1rem/1.3 var(--display);display:flex;gap:8px;align-items:flex-start}
.ex h3 .n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--sunk);color:var(--ink2);font:700 .74rem var(--data);display:grid;place-items:center}
.ex.listo h3 .n{background:var(--ok);color:var(--card)}
.ex h3 .nm{flex:1;min-width:0}
.ex h3 a{flex:0 0 auto;text-decoration:none;font:700 .74rem var(--display);border:1px solid var(--line);border-radius:9px;padding:5px 9px}
.hit{margin:8px 0 3px;font:700 1.12rem/1.3 var(--data);color:var(--ink)}
.hit small{display:block;font:700 .64rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin-bottom:4px}
.hit[data-t="up"]{color:var(--ok)} .hit[data-t="down"]{color:var(--bad)} .hit[data-t="chg"]{color:var(--warn)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:.8rem;color:var(--ink3)}
.meta .rest{border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:4px 11px;min-height:34px;cursor:pointer;font-size:.8rem;color:var(--ink)}
.ex details{margin-top:6px}
.ex details>summary{min-height:36px;font-size:.8rem;color:var(--ink3)}
.sets{display:grid;gap:6px;margin-top:8px}
.set{display:grid;grid-template-columns:28px minmax(0,1fr) auto minmax(0,1fr) auto;gap:6px;align-items:center}
.set .sn{font:700 .72rem var(--data);color:var(--ink3)}
.set input{text-align:center;padding:9px 6px}
.set .u{font-size:.74rem;color:var(--ink3)}
.add{justify-self:start;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:6px 12px;min-height:38px;font-size:.8rem;color:var(--ink2);cursor:pointer}
.opcion{margin:18px 0 8px}
.ex.opt{box-shadow:none;background:transparent}
.retro{background:var(--card);border:2px solid var(--acc);border-radius:20px;padding:16px 14px;margin:4px 0 14px;box-shadow:var(--shadow)}
.retro.entra{animation:entra .36s cubic-bezier(.2,.8,.2,1)}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ring{display:flex;align-items:center;gap:12px;margin:10px 0 12px}
.ring b{font:850 1.7rem/1 var(--display);font-stretch:112%;font-variant-numeric:tabular-nums}
.ring .sub{line-height:1.35;font-size:.86rem}
.r3{display:grid;gap:8px}
.r3 li{border-radius:12px;padding:9px 11px;font-size:.92rem;line-height:1.4}
.r3 .lb{display:block;font:800 .68rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.r3 .ok{background:var(--ok-w)} .r3 .ok .lb{color:var(--ok)}
.r3 .fix{background:var(--warn-w)} .r3 .fix .lb{color:var(--warn)}
.r3 .next{background:var(--acc-w)} .r3 .next .lb{color:var(--acc)}
.alerta{margin-top:8px;background:var(--bad-w);border-radius:10px;padding:8px 10px;font-size:.88rem}
textarea.out{display:none;height:9rem;font:12px/1.4 var(--data)}
.volrow{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 2.6rem;gap:8px;align-items:center;font-size:.8rem}
.volrow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.volrow .tr{position:relative;height:14px;border-radius:7px;background:var(--sunk);overflow:hidden}
.volrow .zn{position:absolute;top:0;bottom:0;background:var(--acc-w)}
.volrow .fl{position:absolute;top:3px;bottom:3px;left:0;border-radius:5px;background:var(--acc);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.volrow .v{text-align:right;font:700 .8rem var(--data)}
.tec li{padding:10px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.tec li:first-child{border-top:0}
.tec .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tec .t b{font:750 .92rem/1.3 var(--display)}
.tec p{font-size:.86rem;color:var(--ink2)}

/* ── COMIDA ── */
.macro{display:grid;gap:10px}
.mbar{display:grid;grid-template-columns:4.8rem minmax(0,1fr) auto;gap:10px;align-items:center;font-size:.84rem}
.mbar .tr{height:12px;border-radius:6px;background:var(--sunk);overflow:hidden}
.mbar .tr i{display:block;height:100%;border-radius:6px;background:var(--acc);transform-origin:left;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.mbar.p .tr i{background:var(--ok)}
.mbar .v{font:600 .8rem var(--data);white-space:nowrap}
.tiempo{display:grid;grid-template-columns:3.4rem minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.tiempo:first-child{border-top:0}
.tiempo .h{font:700 .92rem/1.2 var(--data);color:var(--ink3)}
.tiempo b{font:750 .95rem/1.25 var(--display)}
.tiempo p{font-size:.88rem;color:var(--ink2);margin-top:2px}
.tiempo .mc{font:500 .74rem var(--data);color:var(--ink3);margin-top:3px}

 hasta 12,12,12. Jalón: dos semanas en 9,9,8, así que la próxima vez descansa 3 minutos completos. Cruce: de 10 a 20 lb fue el doble; regresa a 10 o 15. El lateral en máquina bajó por cansancio: mismo peso, no lo bajes todavía."},{"id":"w8-d3","texto":"Lateral en polea con 30 lb y cuatro series de 16 a 13: el hombro respondió. El remo subió a 120 pero la segunda y la tercera quedaron abajo de 10; la próxima, 110 con 3 minutos completos y busca 12. El press inclinado en máquina quedó sin anotar."},{"id":"w8-d4","texto":"Zancadas exactas (12, 12, 11) y hip thrust en la máquina nueva con 125 × 12, 11, 11: el mismo peso del martes con más repeticiones. Las manos se engarrotaron por el agarre, no por las piernas: la próxima vez usa correas o cambia a zancadas en Smith con el botón de alternativas. Toma agua con una pizca de sal antes de entrenar. Si las manos se duermen, hormiguean o se vuelven a engarrotar sin carga, ve con el médico."}],"propio":true,"programa":{"DIAS":[{"d":"Lunes","n":"Torso A","s":"Empuje · pecho superior + lateral + tríceps · 72 min","key":false,"cal":"F1 · 5–8 min de cardio suave (bici, caminadora, elíptica o ESCALADORA) + 2–3 min de foam roller (dorsal y pectoral). 🆕 17/08 · CUERDA DE SALTAR 3×45 s (descanso 45 s) DENTRO de esos minutos, no encima: aquí la cuerda NO es cardio, es tu trabajo de gemelo y tibial. Bajo, rápido y desde el tobillo. — F2 · ROTACIÓN EXTERNA con banda <a class='tut' href='https://musclewiki.com/exercise/cable-external-rotation' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 2×15 lento y ligero, ANTES de tocar nada → band pull-apart <a class='tut' href='https://musclewiki.com/exercise/band-pull-apart' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 2×20 → 🆕 17/08 · 10 FLEXIONES LENTAS TERMINANDO CADA UNA EMPUJANDO EL SUELO 5 cm MÁS (push-up plus): ese último empujón es el SERRATO, el que rota la escápula hacia arriba y le abre espacio al hombro. — F3 · pirámide completa en el press inclinado: peso mínimo ×15 → 40 % ×5 → 50 % ×4 → 60 % ×3 → 70–75 % ×2.","corte":"Si solo tienes 60 min: el press de pecho en máquina baja a 2 series y el press francés a 2. LOS DOS BLOQUES DE LATERAL (#3 y #4-A2) NO SE TOCAN: son la prioridad #1 del bloque.","e":[["Press inclinado con mancuernas · 30°","3×6–10","8","3–4 min","LA INCLINACIÓN ES 30°, NO 45°. Pasando de 45° el trabajo se va al deltoides anterior y pierdes justo el pecho superior que buscas. Baja hasta sentir el estiramiento, muñecas alineadas. 🆕 17/08 · COSTILLAS ABAJO Y LUMBAR PEGADA AL BANCO: si arqueas para «llegar más», el banco se vuelve plano y el pecho superior se te escapa"],["⭐ Press de pecho en máquina · VERSIÓN INCLINADA, OBLIGATORIA","3×8–12","8–9","2.5 min","🆕 CAMBIO DEL 17/08: LA INCLINACIÓN DEJÓ DE SER OPCIONAL. Tu foto muestra masa en el pectoral medio e inferior y LA REGIÓN CLAVICULAR VACÍA: no necesitas más pecho medio, necesitas el de arriba. MISMAS 3 SERIES, OTRO SITIO. Si el gym no tiene máquina inclinada, el sustituto es CRUCE DE POLEA DE BAJA A ALTA 3×12–20: manos de abajo hacia arriba y adentro, terminando A LA ALTURA DE LA BARBILLA, no del ombligo"],["⭐ Elevación lateral en polea baja cruzada","3×12–20","9","2.5 min","EL #1 DE NIPPARD PARA DELTOIDES LATERAL. El brazo cruza el cuerpo abajo → hay tensión donde la mancuerna no da nada. Meñique ligeramente arriba, CERO IMPULSO DE TORSO. Aquí sí puedes llegar a RPE 10"],["A1 · ⭐ Extensión de tríceps sobre la cabeza en polea con barra","3×10–15","9","0 s → A2","El S+ de tríceps. Estira la cabeza larga bajo tensión. Si el codo se queja, baja peso — NO el ROM"],["A2 · Elevación lateral con mancuerna","3×12–20","9–10","2.5 min","Segunda dosis, otro perfil de resistencia. Sube hasta la horizontal, 1 s arriba. SI EL TRAPECIO SE TE SUBE A LAS OREJAS, EL PESO ESTÁ ALTO"],["A1 · ⭐ Press francés con mancuerna","3×8–12","9","0 s → A2","🆕 25/08 · LO HACES CON MANCUERNA A DOS MANOS y anotas el total: correcto, aquí no hay barra que sumar. Codos apuntando arriba y QUIETOS, bajar detrás de la cabeza. Si molesta el codo → polea con cuerda"],["A2 · ⭐ Face pull","2×15–20","8","1.5 min","Cierre obligatorio. Codos altos, rotación externa al final"]]},{"d":"Martes","n":"Pierna","s":"Cuádriceps, isquios y glúteo · 70 min (76 desde la sem. 3 · 82 desde la 4)","key":false,"cal":"F1 · 5–8 min de BICI — 🆕 17/08 · HOY LA ESCALADORA NO: es cuádriceps y glúteo, y calentar con ella antes del hack squat es pre-fatigar justo el músculo del día. Tampoco cuerda. + 2–3 min de foam roller (cuádriceps y glúteo). — F2 · 🆕 17/08 · RESPIRACIÓN 90/90 · 2×5 respiraciones (boca arriba, pies en la pared, caderas y rodillas a 90°, LUMBAR PEGADA AL SUELO, exhalar largo hasta sentir que las costillas bajan) → PUENTE DE GLÚTEO <a class='tut' href='https://musclewiki.com/exercise/barbell-glute-bridge' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 2×15 con pausa de 2 s → abducción con banda <a class='tut' href='https://musclewiki.com/exercise/dumbbell-standing-hip-abduction' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 2×20 → bisagra de cadera con barra vacía <a class='tut' href='https://musclewiki.com/exercise/barbell-romanian-deadlift' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 2×10. Si el glúteo no dispara primero, el isquio y la lumbar se adueñan del patrón. — F3 · pirámide completa en hack squat.","corte":"Si solo tienes 60 min: cae el tibial y la superserie #4 baja a 2 pares — 2 de SÓLEO y 2 de cuádriceps, no 3 de uno y 0 del otro (eso pasó el 25/08 y costó el gemelo de la semana entera). Hack squat y RDL no se tocan. — ESTE DÍA CRECE, Y LOS EJERCICIOS YA ESTÁN ABAJO EN LA TABLA (no hay que acordarse de nada): en la SEMANA 3 entra la elevación lateral a una mano (+3 series, el lateral pasa a 15) y el día va a ~76 min; en la SEMANA 4 entra además el pullover (+3, el dorsal pasa a 15) y va a ~82 min. 🔴 09/09 · YA PASÓ DOS VECES, ASÍ QUE DEJA DE SER EL PLAN B: si el martes te da MENOS DE 75 MIN, la elevación lateral a una mano y el pullover NO se recortan — se hacen el SÁBADO después de nadar, como bloque suelto de 12 min, y los anotas en la casilla del martes. Son polea: no compiten con la fuerza ni con la carrera. Lo que cae dentro del martes es el TIBIAL, nunca el hack squat ni el RDL.","e":[["⭐ Hack squat","3×6–10","8","3–4 min","EL S+ DE NIPPARD PARA CUÁDRICEPS, por encima de la sentadilla libre. Estiramiento profundo sin costo de estabilización ni carga lumbar. Pies un poco adelantados y NO muy anchos: hoy sí queremos cuádriceps. Si los talones se levantan, calzado con talón"],["⭐ Peso muerto rumano","3×6–10","8","3–4 min","PARA EN EL NÚMERO QUE DIGA LA NOTA, aunque te salga una más: aquí te vacías en las dos primeras y la tercera se cae. LIDERA LA CADERA, NO LA RODILLA. Ángulo de rodilla bloqueado; si avanza, dejó de ser RDL. Baja hasta el estiramiento del isquio, no al suelo. 🆕 17/08 · Y ARRIBA NO TE HIPEREXTIENDAS: terminas DE PIE, COSTILLAS ABAJO, GLÚTEO APRETADO — no echando la cadera al frente y arqueando la lumbar. Ese final arqueado es el mismo patrón que se ve en tu foto de perfil"],["⭐ Hip thrust en máquina","3×6–10","8","3 min","DESCANSA LOS 3 MIN COMPLETOS con el temporizador: cuando la tercera serie se cae aquí, casi nunca sobra peso — falta recuperación. 🆕 25/08 · LO HACES EN MÁQUINA, y está bien: la carga es la de la placa, sin barra que sumar. Ajusta el respaldo para que el borde quede BAJO EL OMÓPLATO, no en la espalda media. Barbilla al pecho, costillas abajo, PAUSA DE 1 s ARRIBA, cero hiperextensión lumbar. El glúteo se activa al máximo en extensión completa de cadera"],["A1 · ⭐ Sóleo (gemelo sentado)","3×12–20","9","0 s → A2","🆕 25/08 · AHORA ABRE LA SUPERSERIE. Se cayó entero el martes 25 al recortar a 60 min, y es tu única dosis de sóleo de la semana: el cuádriceps ya viene servido por el hack squat, el gemelo no tiene nada más. Va primero para que, si algo cae, caiga lo que sí tiene respaldo. Pausa de 2 s abajo, en el estiramiento. Es tu seguro para correr dos veces por semana"],["A2 · Extensión de cuádriceps","3×12–20","9","2 min","NO es redundante con la hack: el recto femoral cruza cadera y rodilla, y solo se estimula bien con la cadera extendida. Pausa arriba 1 s"],["Tibial anterior","2×15–25","8","1 min","Previene la periostitis. Corres 2× por semana: no te lo saltes"]]},{"d":"Miércoles","n":"Torso B","s":"Jalón · dorsal + posterior + bíceps · 68 min","key":false,"cal":"F1 · 5–8 min de remo o ESCALADORA + 2–3 min de foam roller (dorsal). — F2 · colgarse de la barra <a class='tut' href='https://musclewiki.com/exercise/pull-ups' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 2×20 s → band pull-apart <a class='tut' href='https://musclewiki.com/exercise/band-pull-apart' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 2×20 → elevación de escápula colgado <a class='tut' href='https://musclewiki.com/exercise/pull-ups' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 2×8. — F3 · 3 aproximaciones en el jalón: 45 % → 65 % → 85 %.","corte":"Si solo tienes 60 min: cae el paseo del granjero y el curl martillo baja a 2. El bloque de dorsal (#1 y #2) NO se toca. — CARRERA Z2 por la tarde, mínimo 6 h después. Hoy no compite con nada: mañana es puro torso. Esta carrera SÍ puede crecer en duración con el plan de la §8 — es el cambio que trajo el calendario nuevo.","e":[["⭐ Jalón al pecho, agarre ancho","3×8–12","8","3 min","De los más eficientes para el músculo. Esta máquina sube de 20 en 20 lb: cuando el escalón de arriba te saque del rango, se progresa por repeticiones o se cambia de herramienta. Torso ~15° atrás, barra al pecho alto, DEJA QUE LA ESCÁPULA SUBA DEL TODO ARRIBA — ahí está el estiramiento. CODOS ABAJO, MUÑECAS ARRIBA. Nunca tras la nuca"],["⭐ Remo Meadows (o remo con mancuerna a una mano)","3×8–12","8–9","3 min","🔴 S-tier. El agarre perpendicular da un estiramiento de dorsal que ningún remo bilateral consigue. NO ROTES EL TORSO para completar la rep"],["A1 · ⭐ Cruce inverso en polea","3×15–20","9","0 s → A2","📌 EL PESO NO SE TOCA: 10 lb es la placa mínima de esa polea, así que aquí SIEMPRE se progresa por repeticiones. De los más eficientes para deltoides posterior. NO APRIETES ESCÁPULAS o se vuelve remo. El posterior es la mitad de atrás de la anchura del hombro"],["A2 · ⭐ Curl Bayesian (de espaldas a la polea)","3×10–15","9","2.5 min","📌 04/09 · YA CLAVASTE 15,15,14 con 30 lb, que es el tope del rango: TOCA SUBIR a 40 y arrancar en 12,11,10. El S+ de bíceps. Brazo detrás del torso: tensión máxima en el estiramiento. El codo no viaja al frente"],["A1 · Curl martillo con cuerda","3×10–15","9","0 s → A2","📌 04/09 · PESO POR CONFIRMAR: la nota decía 25 lb y el 07/09 pusiste 50 con 11,10,9. Dime cuál es antes de moverlo. Agarre neutro, sin rotar. Braquial y braquiorradial: grosor del brazo y del antebrazo a la vez — por eso el antebrazo directo baja a 3 series y no pasa nada"],["A2 · ⭐ Face pull","2×15–20","8","1.5 min","✅ 04/09 · 40 lb · 17,16 está en su sitio. No se toca: es la dosis de salud del hombro, no un ejercicio de progresión. Segunda dosis semanal. Trapecio medio e inferior: HOMBROS ATRÁS = MÁS ANCHO, sin tocar la pendiente del cuello"],["Paseo del granjero","2×40–60 s","—","1.5 min","🔴 04/09 · EL MIÉRCOLES NO QUEDÓ ANOTADO. Es el último de la sesión y por eso se cae: anótalo aunque sea una serie. Lo más pesado que puedas agarrar. Antebrazo, trapecio y core en un solo ejercicio"]]},{"d":"Jueves","n":"DÍA V","s":"Hombro lateral + dorsal + pecho superior + core · 72 min","key":true,"cal":"F1 · 5–8 min de cardio suave (bici, elíptica o ESCALADORA) + 2–3 min de foam roller. 🆕 17/08 · CUERDA DE SALTAR 3×45 s DENTRO de esos minutos (2ª y última dosis de la semana). — F2 · EL MÁS LARGO DE LA SEMANA, 5 MIN, Y NO SE RECORTA: rotación externa <a class='tut' href='https://musclewiki.com/exercise/cable-external-rotation' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 3×15 → band pull-apart <a class='tut' href='https://musclewiki.com/exercise/band-pull-apart' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 2×20 → 🆕 17/08 · WALL SLIDE CON BANDA 2×10, QUE SUSTITUYE A LA ELEVACIÓN DE ESCÁPULA COLGADO (antebrazos en la pared con banda ligera que abre, subir sin despegarlos y SIN que las costillas se disparen al frente; arriba, empujar la pared 2–3 cm más. Si lo sientes en el cuello, bajaste mal las costillas) → elevación lateral con banda 2×20 sin peso, solo para que el deltoides dispare. Hoy se concentran 6 series de lateral + 6 de dorsal + 3 de pecho sobre la misma articulación, y el face pull NO cubre la rotación superior de la escápula: eso lo hace el serrato. — F3 · 1–2 aproximaciones en la polea; no hace falta pirámide en un aislado.","corte":"Si solo tienes 60 min: cae la rueda abdominal y el press inclinado baja a 2 series. LOS #1, #3 y #4 SON EL DÍA ENTERO: no se tocan. — Por qué los laterales van dos veces hoy, en dos ejercicios distintos: el deltoides lateral es barato de recuperar y se beneficia de dos perfiles de resistencia. La polea carga cruzando abajo; el banco inclinado carga en el estiramiento lateral. Son estímulos distintos, no la misma serie repetida.","e":[["⭐ Elevación lateral en polea baja cruzada","3×12–20","9","2.5 min","TU EJERCICIO #1 DEL BLOQUE, EN EL MEJOR MOMENTO DE LA SEMANA. Un aislado abriendo la sesión es deliberado: es la regla de que el grupo rezagado va primero. Cero impulso, meñique arriba, BAJA LENTO hasta que el cable tire de verdad"],["Press inclinado en máquina o en Smith a 30°","3×8–12","8","3 min","Segunda dosis de pecho superior, con estabilización cero para que la carga se la lleve el pecho. Banco a 30°"],["⭐ Pullover en polea","3×12–15","9","2.5 min","EL EJERCICIO DEL «VUELO». Brazos casi rectos, el arco pasa por encima de la cabeza. SI FLEXIONAS EL CODO SE VUELVE TRÍCEPS y pierdes el ejercicio. Es dorsal puro, sin bíceps: por eso entra aquí y no el miércoles"],["A1 · Elevación lateral tumbado en banco inclinado","3×12–20","9–10","0 s → A2","Tumbado de lado: la mancuerna carga EN EL ESTIRAMIENTO, justo donde la versión de pie no da nada. Último set: 5–8 parciales en la mitad baja"],["A2 · ⭐ Remo en polea sentado, agarre ancho","3×10–15","8–9","2.5 min","Deja que la escápula viaje al frente abajo para ganar estiramiento. CODOS ABAJO, MUÑECAS ARRIBA. Cero balanceo lumbar"],["A1 · Rueda abdominal (desde rodillas)","3×6–12","8","0 s → A2","ANTI-EXTENSIÓN: aprieta la pared abdominal, no la ensancha. Costillas abajo, pelvis en retroversión, NO ARQUEES LA LUMBAR. 🆕 REGLA NUEVA DEL 17/08 — EL RANGO LO MARCA LA LUMBAR, NO LOS BRAZOS: ruedas SOLO hasta donde la pelvis aguanta en retroversión, y en el momento en que la lumbar se arquea, ahí estaba tu tope. 3 s en la bajada. Media rueda sin arquear vale más que una entera arqueada. Si no puedes sostener las costillas abajo ni media rueda: SUSTITUTO = DEAD BUG 3×8 por lado, lento"],["A2 · ⭐ Face pull","2×15–20","8","1.5 min","Tercera dosis semanal"]]},{"d":"Viernes","n":"Día grande","s":"Glúteo, brazo, trapecio y detalle · 69 min","key":false,"cal":"F1 · 5–8 min de cardio suave (bici, elíptica o ESCALADORA) + 2–3 min de foam roller. — F2 · puente de glúteo <a class='tut' href='https://musclewiki.com/exercise/barbell-glute-bridge' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 2×15 → band pull-apart <a class='tut' href='https://musclewiki.com/exercise/band-pull-apart' target='_blank' rel='noopener' title='Cómo se ejecuta'>▶<\/a> 2×20 → CÍRCULOS Y FLEXIÓN/EXTENSIÓN DE MUÑECA 2×15 (el antebrazo se lesiona por entrar frío). — F3 · 2 aproximaciones en las zancadas: 50 % → 70 %.","corte":"Si solo tienes 60 min: cae la superserie #5 completa y las zancadas bajan a 2 series. — Por qué el viernes acumula tantas series en tan poco tiempo: son todas de costo sistémico bajo y van en pares. Nueve ejercicios con descansos largos no cabrían; cuatro superseries y un compuesto ligero sí.","e":[["⭐ Zancadas caminando","3×10–12 /pierna","8","2.5 min","De los más eficientes para glúteo. PASO LARGO, torso ligeramente inclinado. PASO CORTO = se vuelve cuádriceps. Al ser unilateral obliga a trabajar al glúteo medio. 🆕 17/10 · Si el agarre se cansa antes que las piernas (te pasó el 16 oct), usa correas (straps) o cambia a Smith con el botón de alternativas: el ejercicio es de piernas, no de antebrazo.",[{"n":"Zancadas en máquina Smith","t":"La barra del Smith va en la espalda: el agarre deja de limitar. Paso largo, torso un poco al frente y baja la rodilla de atrás casi al piso. Mismo peso total como referencia, ajusta en la primera serie.","u":"https://www.youtube.com/results?search_query=zancadas+en+smith+t%C3%A9cnica+correcta"},{"n":"Sentadilla búlgara con correas","t":"Pie de atrás en la banca, mancuernas con correas (straps). Torso un poco al frente, la rodilla sigue la punta del pie. Cada pierna cuenta su serie.","u":"https://www.youtube.com/results?search_query=sentadilla+b%C3%BAlgara+t%C3%A9cnica+correcta"}]],["A1 · ⭐ Femoral sentado","3×10–15","9","0 s → A2","Cadera pegada al asiento. El sentado estira más el isquio que el tumbado. Aquí sí puedes llegar a RPE 10"],["A2 · ⭐ Abducción de cadera en máquina","3×15–25","9–10","2 min","Glúteo medio, dominante en fibra tipo I → responde a reps altas. Torso ligeramente al frente carga más glúteo"],["A1 · ⭐ Curl predicador en máquina","3×10–15","9","0 s → A2","S-tier. Bajada controlada; NO SUELTES EL PESO DE GOLPE al final — es riesgo de codo"],["A2 · Jalón de tríceps con cuerda","3×12–20","9–10","2.5 min","El complemento acortado del press francés. Codos fijos al costado, extensión completa, 1 s"],["A1 · Encogimientos con mancuernas","3×10–15","9","0 s → A2","ÚNICA DOSIS SEMANAL DE TRAPECIO SUPERIOR, Y ES A PROPÓSITO (ver §3). Sube RECTO y sostén 1 s. Nada de rotar los hombros"],["A2 · Gemelo de pie","3×8–15","9","1.5 min","ROM completo, pausa abajo. Nada de rebotar con el Aquiles"],["A1 · Curl de muñeca con barra (sentado)","3×15–25","9","0 s → A2","Antebrazos apoyados en el muslo, ROM completo, deja que la barra ruede a los dedos abajo"],["A2 · ⭐ Face pull","2×15–20","8","1.5 min","Cuarta y última dosis semanal. CIERRAS LA SEMANA CON LOS HOMBROS ATRÁS"]]}],"EXTRA":{"1":[{"desde":2,"e":["⭐ Elevación lateral en polea baja, a UNA mano","3×12–20","9","2.5 min","ENTRA EN LA SEMANA 3: es la tercera dosis semanal de lateral y lo que sube el grupo a 15 series. A una mano a propósito — la polea sube de 10 en 10 y unilateral te deja progresar fino, además de ganar recorrido. Cuerpo ligeramente inclinado alejándote de la polea, meñique arriba, CERO impulso de cadera. 2.5 min de descanso, no 60 s"]},{"desde":3,"e":["⭐ Pullover en polea","3×10–15","9","2 min","ENTRA EN LA SEMANA 4: sube el dorsal a 15. Es el mismo del jueves, así que ya sabes el setup. Codos casi fijos, tira con el dorsal desde el estiramiento de arriba, costillas abajo"]}],"2":[{"desde":6,"e":["⭐ Curl inclinado con mancuernas","3×10–12","8–9","90 s","ENTRA EN LA SEMANA 7 (28/09) COMO PARTE FIJA DEL PROGRAMA, no como extra de casa. Banco a 45–60°: el brazo queda DETRÁS del cuerpo y el bíceps carga en su estiramiento máximo — por eso vale más que un curl de pie. Codos quietos, sin balanceo, baja controlado. Es tu segunda dosis de bíceps de la semana"]},{"desde":7,"e":["⭐ Elevación lateral en máquina (o con mancuerna, sentado en banco a 90°)","3×12–20","9","2.5 min","ENTRA EN LA SEMANA 8 Y SOLO SI EL HOMBRO NO HA DICHO NADA: es el tercer ejercicio de lateral, el que lleva el grupo a 18 — el tope del bloque. Va en miércoles porque es el único día sin lateral: sube la frecuencia a 4× sin amontonar más series en un solo día. Si el hombro se queja en la semana 6, este ejercicio NO entra y el bloque cierra en 15"]}],"4":[{"desde":6,"e":["Curl de muñeca con barra (sentado)","2×15–20","9","60 s","VUELVE EN LA SEMANA 7 COMO PARTE FIJA (28/09): el antebrazo era el grupo más subdosificado del bloque. Antebrazos apoyados en el muslo, ROM completo, deja que la barra ruede hasta los dedos abajo. Cierra el día con el granjero del miércoles como pareja"]}]},"CAMBIO":{"2-1":{"desde":5,"e":["⭐ Remo en barra T (landmine, agarre neutro)","3×8–12","8–9","3 min","SUSTITUYE AL MEADOWS desde la semana 6 (lo pediste el 17/09). Si tu gym tiene la máquina con apoyo de pecho, úsala: quita la lumbar de la ecuación. En landmine: bisagra de cadera, espalda neutra, pecho arriba; los CODOS van hacia la cadera, no hacia arriba, y arriba aprietas 1 s. NADA de impulso de piernas. Peso de arranque: 90 lb en discos (2×45); calíbralo en la descarga"]},"4-7":{"desde":8,"e":["⭐ Hip thrust en máquina nueva · 2ª dosis","3×8–12","8","3 min","Segunda dosis semanal en la máquina nueva (más recorrido). Desde el 16 oct tu marca es 125 × 12, 11, 11: el mismo peso del martes con más repeticiones. Baja hasta la profundidad completa y pausa 1 s arriba sin arquear."]},"1-2":{"desde":8,"e":["⭐ Hip thrust en máquina nueva (más profundidad)","3×8–12","8","3 min","Máquina nueva desde el martes 13 oct: más recorrido abajo y mejor movimiento, por eso el peso no se compara con la anterior (225 lb). Tu marca nueva arranca en 125 × 10, 9, 8. Respaldo bajo los omóplatos, barbilla al pecho, baja hasta la profundidad completa y pausa de 1 s arriba sin arquear."]}},"DELOAD_W":5,"DL_PESO":{"d0-e5":[50,"con 50 tu mejor serie fue de 11 (el 60 te sacó del rango dos semanas seguidas)",11],"d2-e1":[70,"es lo que usaste el lunes 21 al estrenar la barra T",8],"d2-e3":[30,"con 30 tu mejor serie fue de 15 (el 40 te sacó del rango por abajo)",15],"d1-e7":[60,"es el mismo pullover del jueves, donde tu mejor serie con 60 fue de 15",15],"d0-e6":[40,"es el peso con el que lo cerraste en septiembre",17],"d3-e6":[40,"es el peso con el que lo cerraste en septiembre",17]},"ORDEN":{"0":{"desde":5,"primero":[6]},"2":{"desde":5,"primero":[6]},"3":{"desde":5,"primero":[6]},"4":{"desde":6,"primero":[0,7,6]}},"OPCIONAL":{"1":[{"desde":5,"k":[5]},{"desde":9,"k":[6,7]}],"2":{"desde":5,"k":[5]},"3":{"des /* ── el programa ──────────────────────────────────────────────────────────── */

var INI = deIso(P.inicio), NSEM = P.semanas;

  if(ex) ex.forEach(function(q){ if(w >= q.desde) out.push(q.e); });
  Object.keys(CAMBIO).forEach(function(ck){ var pk = ck.split("-"); if(+pk[0] === i && w >= CAMBIO[ck].desde && out[+pk[1]]) out[+pk[1]] = CAMBIO[ck].e; });

function esOpcional(i, k, w){ return [].concat(OPCIONAL[i] || []).some(function(o){ return w >= o.desde && o.k.indexOf(k) !== -1; }); } // una regla o una lista de reglas por día

function base(w, i, k){ return "w" + w + "-d" + i + "-e" + k; }

  var n = ns, g = parseInt(get(b + "-n"), 10); if(g > n) n = g;
  for(var j = 24; j >= n; j--) if((get(b + "-s" + j + "-w") || "") !== "" || (get(b + "-s" + j + "-r") || "") !== ""){ n = j + 1; break; }

function nombre(x){ return String(x[0]).replace("⭐ ", "").replace(/^A[12] · /, ""); }
function corto(x){ return nombre(x).replace(/\s*\(.*?\)\s*/g, " ").split(" · ")[0].trim(); }
function segDescanso(t){ t = String(t); var m = t.match(/(\d+(?:\.\d+)?)\s*(?:[–-]\s*\d+(?:\.\d+)?)?\s*min/); if(m) return Math.round(parseFloat(m[1]) * 60); m = t.match(/(\d+)\s*s\b/); return m ? +m[1] : 0; }

/* Lo que toca hoy: manda la nota escrita de esa semana; si no hay, la doble
   progresión desde la última vez. El panel nunca se queda sin instrucción. */
function objetivo(i, k, x, w){
  var rg = rango(x[1]);
  if(esDeload(w)) return { lbl:"Descarga", hit: x[1] + " · RPE 6 a 7", t:"keep", w:null, reps:[], why:"Mismo peso de la semana anterior, menos series y paras con 3 repeticiones en el tanque." };
  var pw = planWeb(w), pa = pw && pw.ajustes && pw.ajustes["d" + i + "-e" + k];

  var aj = AJUSTE["d" + i + "-e" + k];

    var bw = escalonAbajo(pw), br = [];

/* ── la retro de una sesión: tres líneas ──────────────────────────────────── */
function analizar(i, w){

  ejerciciosDe(i, w).forEach(function(x, k){
    var opc = esOpcional(i, k, w), rg = rango(x[1]), s = seriesDe(w, i, k, x[1]), nom = corto(x);
    if(!opc) R.oblig++;
    if(!s.length){ if(!opc) R.sin.push(nom); return; }
    R.hechos++; s.forEach(function(z){ R.ton += z.w * z.r; });
    if(!rg) return;
    var rr = s.map(function(z){ return z.r; }), txt = rr.join(",");
    R.nSer += rr.length; R.en += rr.filter(function(r){ return r >= rg.lo && r <= rg.hi; }).length;
    var def = suma(rr.map(function(r){ return Math.max(0, rg.lo - r); })), ob = objetivo(i, k, x, w), meta = ob.reps.slice(0, rr.length);
    if(rr.length < rg.n && !opc) R.hall.push({ s: 40 * (rg.n - rr.length), t:"<b>" + esc(nom) + "</b>: " + (rg.n - rr.length === 1 ? "faltó una serie" : "faltaron " + (rg.n - rr.length) + " series") + ". Va antes que cualquier opcional." });
    if(rr.length >= rg.n && rr.every(function(r){ return r >= rg.hi; })){ R.sube.push(nom + (s[0].w ? " a " + escalon(s[0].w * 1.05) : "")); R.bien.push({ s:30, t:"<b>" + esc(nom) + "</b> " + txt + ", tope del rango" }); }
    else if(meta.length && s[0].w >= (ob.w || 0) && suma(rr) > suma(meta)) R.bien.push({ s: 20 + suma(rr) - suma(meta), t:"<b>" + esc(nom) + "</b> " + txt + ", arriba de lo pedido" });
    else if(meta.length && suma(rr) === suma(meta) && rr.length >= rg.n) R.bien.push({ s:10, t:"<b>" + esc(nom) + "</b> " + txt + ", exacto" });
    if(def >= 3){ R.baja.push(nom); R.hall.push({ s: def * 8, t:"<b>" + esc(nom) + "</b> " + txt + ": " + def + " reps bajo el rango. El peso está alto, baja un escalón hasta que entren las " + rg.n + "." }); }
    else if(def > 0) R.hall.push({ s: def * 8, t:"<b>" + esc(nom) + "</b> " + txt + ": " + (def === 1 ? "faltó una rep" : "faltaron " + def + " reps") + " para el rango. Mismo peso y descanso completo." });
    else if(rr.length > 1 && rr[rr.length - 1] > rr[0]) R.hall.push({ s:15, t:"<b>" + esc(nom) + "</b> " + txt + ": las reps subieron, la primera fue calentamiento. Haz 2 series de aproximación antes." });
    else if(rr.length > 1){ var c = (rr[0] - rr[rr.length - 1]) / rr[0] * 100; if(c >= 35) R.hall.push({ s: c - 20, t:"<b>" + esc(nom) + "</b> " + txt + ": cayó " + Math.round(c) + " % de la primera a la última. Ponle tope a la primera." }); }
  });

}
function lineasRetro(i, w){

  var fix = R.hall.length ? R.hall[0].t : "Nada que corregir hoy.";
  if(R.sin.length) fix += '<br><span class="tiny">Sin anotar: ' + R.sin.length + (R.sin.length === 1 ? ' ejercicio' : ' ejercicios') + '.</span>';
  var nx = [];
  if(R.sube.length) nx.push("Sube: " + esc(R.sube.join(" · ")) + ".");
  if(R.baja.length) nx.push("Baja un escalón: " + esc(R.baja.join(", ")) + ".");
  nx.push(R.sube.length || R.baja.length ? "El resto: mismo peso y una rep más." : "Mismo peso y una rep más en todo.");

  if(F.poco.length) nx.push("Poco bombeo en " + esc(F.poco.join(", ")) + ": baja en 3 segundos y con rango completo.");

}
function sesionHecha(w, i){
  if(get("w" + w + "-d" + i + "-fin")) return 1;
  var seed = CFG.seeds && CFG.seeds.SEED_EST && CFG.seeds.SEED_EST[w] && CFG.seeds.SEED_EST[w][i];
  if(seed) return seed === "ok" || seed === "est" ? 1 : (seed === "part" ? .5 : 0);
  var n = 0, t = 0;
  ejerciciosDe(i, w).forEach(function(x, k){ if(esOpcional(i, k, w)) return; t++; if(seriesDe(w, i, k, x[1]).length) n++; });

}

/* ── estado de la vista ───────────────────────────────────────────────────── */
var HASH = (location.hash || "").replace("#", "");

if(ENL && ENL[2]){ var dx = ["lun","mar","mie","jue","vie","sab","dom"].indexOf(ENL[2]); for(var _i = 0; _i < DIAS.length; _i++) if(dowDe(_i) === dx) DIA = _i; }

var RETRO = {};
/* retros semanales del coach que llegan de la hoja (18 oct 2026): [{f:"AAAA-MM-DD", t, sem}] */
var COACH_WEB = [], PLAN_WEB = []; try{ COACH_WEB = JSON.parse(localStorage.getItem((typeof NS !== "undefined" ? NS : "") + "coach-web") || "[]") || []; }catch(e){}

   Solo trae EXCEPCIONES; todo lo demás lo sigue calculando la doble progresión. */
function separaPlan(){ PLAN_WEB = COACH_WEB.filter(function(r){ return /^plan-/.test(r.f || ""); }); COACH_WEB = COACH_WEB.filter(function(r){ return !/^plan-/.test(r.f || ""); }); }

  var r = PLAN_WEB.filter(function(x){ return +x.sem === w + 1; }).sort(function(a, b){ return a.f < b.f ? 1 : -1; })[0];
  if(!r) return null; try{ var o = typeof r.t === "string" ? JSON.parse(r.t) : r.t; return o && typeof o === "object" ? o : null; }catch(e){ return null; }
}

  var ahora = _h.getHours() * 60 + _h.getMinutes(), pend = lista.filter(function(t){ return dia(HOYI, "c-" + t.id) !== "1"; });
  if(!pend.length) return null;

  return prox[0] || pend[pend.length - 1];
}

/* ── disposición del día (autorregulación) ── */
function disposicion(dI){
  var s = parseFloat(dia(dI, "sueno")), e = parseInt(dia(dI, "energia"), 10), m = dia(dI, "mol"), pts = 0, n = 0;
  if(s > 0){ pts += clamp((s - 4.5) / (CK.sueno - 4.5), 0, 1) * 45; n += 45; }
  if(e > 0){ pts += (e - 1) / 4 * 35; n += 35; }
  if(m){ pts += m === "Nada" ? 20 : 4; n += 20; }
  if(!n) return null;
  var v = Math.round(pts / n * 100);
  return { v: v, t: v >= 75 ? "Listo para ir con todo" : v >= 50 ? "Entrena normal, sin forzar récords" : "Baja un punto el esfuerzo hoy", col: v >= 75 ? "var(--ok)" : v >= 50 ? "var(--plate15)" : "var(--bad)",

}

  });
  var out = {}; Object.keys(MAPA_N).forEach(function(g){ out[g] = ult[g] ? clamp(Math.round(diasEntre(ult[g], HOY) * 24 / 72 * 100), 0, 100) : null; });

}

/* ══════════════════════════════ v9 · NAVEGACIÓN Y ACOMPAÑAMIENTO (17 oct 2026) ══
   «Mejora la navegación, mejores adaptaciones, que se vea dinámico, lindo y

function ruta(){ return VIEW + (SUB[VIEW] ? "-" + SUB[VIEW] : ""); }
function leerRuta(h){
  var m = /^(hoy|entreno|comida|avances|notas)(?:-([a-z]+))?$/.exec(h || ""); if(!m) return false;
  VIEW = m[1]; if(m[2]) SUB[VIEW] = m[2]; return true;
}
var _rutaPropia = false;
function empujaRuta(){ var r = ruta(); if((location.hash || "").slice(1) === r) return; _rutaPropia = true; try{ location.hash = r; }catch(e){} }
addEventListener("hashchange", function(){
  if(_rutaPropia){ _rutaPropia = false; return; }
  var antes = VIEW; if(leerRuta((location.hash || "").slice(1))){ DIR = VIEWS.indexOf(VIEW) >= VIEWS.indexOf(antes) ? 1 : -1; var g = $("gym"); if(g){ g.remove(); GYM = null; } var hs = $("hist"); if(hs){ hs.remove(); HIST = null; } var sh = $("sheet"); if(sh) sh.remove(); pintar(); window.scrollTo(0, 0); }

(function(){ try{ var s = JSON.parse(get("subs") || "{}"); for(var k in s) if(SUB[k]) SUB[k] = s[k]; }catch(e){} })();

/* ── deslizar entre sub-secciones ── */
(function(){
  var x0 = null, y0 = null, t0 = 0;
  document.addEventListener("touchstart", function(e){
    var t = e.target; if(!$("main").contains(t) || t.closest("input,textarea,select,.carril,.seg,.tw,.dias,.chips,.heat,.sets,.g-step")){ x0 = null; return; }
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive:true });
  document.addEventListener("touchend", function(e){
    if(x0 === null || $("gym") || $("hist") || $("sheet")) return;
    var dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if(Math.abs(dx) < 70 || Math.abs(dy) > 45 || Date.now() - t0 > 600) return;
    var L = ORDEN_SUB[VIEW]; if(!L || !SUB[VIEW]) return;
    var i = L.indexOf(SUB[VIEW]), j = i + (dx < 0 ? 1 : -1); if(j < 0 || j >= L.length) return;
    DIR = dx < 0 ? 1 : -1; SUB[VIEW] = L[j]; recuerdaSub(); empujaRuta(); vibra(8); pintar();
  }, { passive:true });
})();

/* ── puntos en la barra de abajo ── */

function sembrarDemo(forzar){
  if(!CFG.demo) return;

  var seed = 7; function rnd(){ seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  var B = CFG.demo.cargas || {};
  for(var w = 0; w < SEM_HOY; w++){
    DIAS.forEach(function(d, i){
      if(rnd() < .08 && w > 0) return;                         // alguna sesión perdida
      ejerciciosDe(i, w).forEach(function(x, k){
        var rg = rango(x[1]); if(!rg || (esOpcional(i, k, w) && rnd() < .5)) return;
        // progresión realista: el peso sube poco a poco y las reps se quedan en rango
        var b0 = B[i + "-" + k] || 20, peso = b0 * (1 + .03 * (esDeload(w) ? Math.max(0, w - 1) : w)), mid = Math.round((rg.lo + rg.hi) / 2) + (w % 2);
        peso = b0 ? (UNI === "kg" ? Math.round(peso / 2.5) * 2.5 : Math.round(peso / 5) * 5) : 0;

      });

    var dd = iso(masDias(HOY, -n)); if(rnd() < .12) continue;
    setDia(dd, "sueno", (6 + Math.round(rnd() * 4) / 2)); setDia(dd, "pasos", Math.round((5500 + rnd() * 5000) / 100) * 100); setDia(dd, "agua", 5 + Math.floor(rnd() * 5));
    setDia(dd, "energia", String(2 + Math.floor(rnd() * 4)));
    comidasDe(deIso(dd)).forEach(function(id){ if(rnd() < .78) setDia(dd, "c-" + id, "1"); });
  }
  (CFG.demo.notas || []).forEach(function(x, q){ var id = "demo" + q; set("nota:" + id + ":t", x.t); set("nota:" + id + ":f", masDias(HOY, -x.hace).toISOString()); if(x.tags) set("nota:" + id + ":tags", x.tags); });

  set("demo-v", String(CFG.demo.v));
}

    fetch(CFG.webhook + "?perfil=" + encodeURIComponent(CFG.slug) + "&llave=" + encodeURIComponent(llave)).then(function(r){ return r.text(); }).then(function(t){
      if(!t || t.charAt(0) !== "{") return;
      var viejo = null; try{ viejo = localStorage.getItem(NS + "perfil-cache"); }catch(e){}
      if(viejo === t) return;
      try{ localStorage.setItem(NS + "perfil-cache", t); }catch(e){ return; }
      location.reload();
    }).catch(function(){});
  }, 1500);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) trae(); });
})();
